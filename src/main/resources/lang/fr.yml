    cannot-move: "<red>Ne bouge pas pendant <white><remaining-second><red>s"
    can-move: "<green>Téléportation dans <white><remaining-second><green>s"
  chat:
    cannot-move: "<prefix><red>Ne bouge pas pendant <white><remaining-second><red>s."
    can-move: "<prefix><green>Téléportation dans <white><remaining-second><green>s"

events:
