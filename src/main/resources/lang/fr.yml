      moved: "<prefix><red>Tu as bougé, réessaie."
      unknown: "<prefix><red>Une erreur est survenue, réessaie."

  forced:
    target:
      console: "<prefix><green>Tu as été téléporté au spawn par <white><sender><green>."
      player: "<prefix><green>Tu as été téléporté au spawn par <reset><head> <white><sender><green>."
    sender: "<prefix><green>Tu as téléporté <reset><head><white><target> <green>au spawn."
