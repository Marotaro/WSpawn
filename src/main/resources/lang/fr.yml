  on-first-join: ""
  on-respawn-block-missing: "<prefix><green>Tu as été téléporté au spawn car tu n'as pas de point de réapparition."
  on-respawn-override-bed: "<prefix><green>Tu as été téléporté au spawn, mais tu as encore un lit placé et accessible."
  on-respawn-override-anchor: "<prefix><green>Tu as été téléporté au spawn, mais tu as encore une ancre de réapparition active."