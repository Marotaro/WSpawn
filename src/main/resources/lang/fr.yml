prefix: "<dark_gray>[<gradient:#55ffff:#5555ff>WSpawn</gradient><dark_gray>] <gray>"

spawn:
  self:
    countdown-start: "<prefix><green>Tu seras téléporté au spawn dans <white><remaining-second><green>s."
    countdown-restart: "<prefix><green>Demande précédente annulée, tu seras téléporté dans <white><remaining-second><green>s."
    confirmation: "<prefix><green>Tu as été téléporté au spawn <dark_gray>(<yellow><spawn-x><gray>, <yellow><spawn-y><gray>, <yellow><spawn-z><dark_gray>)<green>."
