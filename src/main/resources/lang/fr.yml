      multiple-targets: "<prefix><red>Tu ne peux téléporter qu'un seul joueur à la fois."

  cooldown: "<prefix><green>Tu es en temps de recharge pendant encore <white><remaining-second><green>s."

set-spawn:
  confirmation: "<prefix><green>Le spawn a été défini avec succès <dark_gray>(<yellow><spawn-x><gray>, <yellow><spawn-y><gray>, <yellow><spawn-z><dark_gray>)<green>. Ancienne position : <dark_gray>(<yellow><old-x><gray>, <yellow><old-y><gray>, <yellow><old-z><dark_gray>)<green>."
  error:
    console-needs-coordinates: "<prefix><red>Depuis la console, tu dois indiquer les coordonnées."

reload:
  start: "<prefix><green>Rechargement des configurations..."
  confirmation: "<prefix><green>Configurations rechargées avec succès."
  error:
    failed: "<prefix><red>Une erreur est survenue lors du rechargement de <white><error-file><red> : <white><error-message><red>."

timer:
