prefix: "<dark_gray>[<gradient:#55ffff:#5555ff>WSpawn</gradient><dark_gray>] <gray>"

spawn:
  self:
    promise: "<prefix><green>You will be teleported to the spawn in <white><remaining-second><green>s."
    confirmation: "<prefix><green>You were teleported to the spawn <dark_gray>(<yellow><spawn-x><gray>, <yellow><spawn-y><gray>, <yellow><spawn-z><dark_gray>)<green>."
    error:
      moved: "<prefix><red>You moved try again!"
  forced:
    target: "<prefix><yellow>You were teleported to the spawn by <white><sender><yellow>."
    sender: "<green>You teleported <white><target> <green>to the spawn."
    error:
      more-than-one: "<red>You cannot force spawn more than one player at a time"
set-spawn:
  confirmation: "<prefix><green>New spawn Location correctly set, previous was (<old-x>,<old-y>,<old-z>)"
  error:
    needs-verbose-version: "<red>As Console you need to use verbose version"
reload:
  promise: "<prefix><green>Start reloading configs"
  confirmation: "<prefix><green>Configs reloaded successfully"
  error:
    bad: "<red>Something bad happened (<error-message>) with <error-file> "

timer:
  bar: "<red>Stay still for <white><remaining-second>s"
  chat: "<red>Stay still for <white><remaining-second>s"