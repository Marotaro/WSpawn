name: WSpawn
version: '1.1.3'
main: ch.wondercraft.wonderspawn.WSpawn
description: A somewhat customizable Spawn plugin
api-version: '26.1.2'
permissions:
  wspawn.spawn:
    description: "self teleport to spawn"
    default: true
  wspawn.spawn.other:
    description: "force teleport an other to spawn"
    default: op
  wspawn.spawn.all:
    description: "let teleport all player to spawn"
    default: op
  wspawn.spawn.exempt:
    description: "exempt player to be forced teleport when all"
    default: op
  wspawn.set:
    description: "set the new spawn of the server"
    default: op
  wspawn.teleportation.delay.bypass:
    description: "let player bypass waiting time"
    default: op
  wspawn.reload:
    description: "let player reload plugin config"
    default: op
  wspawn.teleportation.move:
    description: "let player move when waiting"
    default: op
  wspawn.teleportation.cooldown.bypass:
    description: "let player bypass cooldown for new request"
    default: op
  wspawn.voidfall.exempt:
    description: "exempt player from automatic teleportation on void fall"
    default: op
  wspawn.voidfall.keep-inventory:
    description: "let player keep their inventory when automatic teleportation on void fall"
    default: false